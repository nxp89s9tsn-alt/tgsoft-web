<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGSoft Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0C1020; color: #F2F6FF; min-height: 100vh; }
        .header { background: #121830; padding: 20px 32px; border-bottom: 1px solid #1E2745; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 20px; color: #60A5FA; }
        .header .user-count { color: #94A3C8; font-size: 14px; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .login-form { max-width: 400px; margin: 60px auto; background: #121830; border-radius: 16px; padding: 32px; border: 1px solid #1E2745; }
        .login-form h2 { color: #F2F6FF; margin-bottom: 20px; }
        .login-form input { width: 100%; background: #0A0F1E; border: 1px solid #1E2745; border-radius: 8px; padding: 12px 16px; color: #F2F6FF; margin-bottom: 16px; font-size: 14px; }
        .login-form input:focus { border-color: #3B82F6; outline: none; }
        .btn { background: #3B82F6; color: white; border: none; border-radius: 8px; padding: 12px 24px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn:hover { background: #60A5FA; }
        .btn-danger { background: #EF4444; }
        .btn-danger:hover { background: #F87171; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .table { width: 100%; border-collapse: collapse; background: #121830; border-radius: 12px; overflow: hidden; }
        .table th { background: #1A2138; color: #94A3C8; padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 700; border-bottom: 1px solid #1E2745; }
        .table td { padding: 12px 16px; border-bottom: 1px solid #1E2745; font-size: 14px; }
        .table tr:hover td { background: #161D38; }
        .status-active { color: #10B981; font-weight: 600; }
        .status-expired { color: #EF4444; font-weight: 600; }
        .status-revoked { color: #F59E0B; font-weight: 600; }
        .status-inactive { color: #64748B; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #121830; border-radius: 16px; padding: 32px; max-width: 420px; width: 90%; border: 1px solid #1E2745; }
        .modal-content h3 { margin-bottom: 20px; color: #F2F6FF; }
        .modal-content input { width: 100%; background: #0A0F1E; border: 1px solid #1E2745; border-radius: 8px; padding: 10px 14px; color: #F2F6FF; margin-bottom: 12px; }
        .modal-btns { display: flex; gap: 12px; margin-top: 8px; }
        .toast { position: fixed; top: 24px; right: 24px; background: #161D38; border: 1px solid #1E2745; border-radius: 8px; padding: 14px 20px; color: #F2F6FF; z-index: 200; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        .toast.success { border-color: #10B981; }
        .toast.error { border-color: #EF4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>TGSoft Admin Panel</h1>
        <div class="user-count" id="userCount"></div>
    </div>

    <!-- Login -->
    <div class="login-form" id="loginForm">
        <h2>Admin Login</h2>
        <input type="text" id="adminLogin" placeholder="Login" value="admin">
        <input type="password" id="adminPass" placeholder="Password">
        <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    </div>

    <!-- Dashboard -->
    <div class="container" id="dashboard" style="display:none">
        <div style="display:flex;justify-content:space-between;margin-bottom:20px;align-items:center">
            <h2 style="color:#F2F6FF">Users</h2>
            <button class="btn" onclick="refreshUsers()">Refresh</button>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Login</th>
                    <th>Status</th>
                    <th>Period</th>
                    <th>Days Left</th>
                    <th>Expires</th>
                    <th>Last Login</th>
                    <th>Machine</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Set Period</h3>
            <input type="number" id="modalDays" placeholder="Days (e.g. 30)">
            <div class="modal-btns">
                <button class="btn" onclick="confirmSetPeriod()">Confirm</button>
                <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminLogin = '';
        let adminPass = '';
        let selectedUser = '';

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type || '');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function doLogin() {
            adminLogin = document.getElementById('adminLogin').value;
            adminPass = document.getElementById('adminPass').value;
            if (!adminLogin || !adminPass) { showToast('Enter credentials', 'error'); return; }
            await refreshUsers();
        }

        async function refreshUsers() {
            try {
                const resp = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({admin_login: adminLogin, admin_password: adminPass, action: 'list'})
                });
                const data = await resp.json();
                if (!data.ok) { showToast(data.error || 'Error', 'error'); return; }

                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userCount').textContent = data.users.length + ' users';

                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';
                data.users.forEach(u => {
                    const statusClass = 'status-' + (u.status || 'inactive');
                    const expires = u.expires_at ? new Date(u.expires_at).toLocaleDateString() : '-';
                    const lastLogin = u.last_login ? new Date(u.last_login).toLocaleString() : '-';
                    const machine = u.machine_id ? u.machine_id.substring(0, 8) + '...' : '-';
                    const daysLeft = u.expires_at ? Math.max(0, Math.ceil((new Date(u.expires_at) - new Date()) / 86400000)) : '-';

                    tbody.innerHTML += `<tr>
                        <td><b>${u.login}</b></td>
                        <td class="${statusClass}">${u.status || 'inactive'}</td>
                        <td>${u.period_days || 0}d</td>
                        <td>${daysLeft}</td>
                        <td>${expires}</td>
                        <td>${lastLogin}</td>
                        <td>${machine}</td>
                        <td>
                            <button class="btn btn-sm" onclick="openModal('${u.login}')">Set Period</button>
                            <button class="btn btn-sm btn-danger" onclick="revokeUser('${u.login}')">Revoke</button>
                        </td>
                    </tr>`;
                });
            } catch (e) { showToast('Connection error', 'error'); }
        }

        function openModal(login) {
            selectedUser = login;
            document.getElementById('modalTitle').textContent = 'Set period for: ' + login;
            document.getElementById('modalDays').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function confirmSetPeriod() {
            const days = parseInt(document.getElementById('modalDays').value);
            if (!days || days <= 0) { showToast('Enter valid days', 'error'); return; }
            try {
                const resp = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({admin_login: adminLogin, admin_password: adminPass, action: 'set_period', login: selectedUser, days: days})
                });
                const data = await resp.json();
                if (data.ok) { showToast('Period set: ' + days + ' days', 'success'); closeModal(); refreshUsers(); }
                else { showToast(data.error, 'error'); }
            } catch (e) { showToast('Error', 'error'); }
        }

        async function revokeUser(login) {
            if (!confirm('Revoke ' + login + '?')) return;
            try {
                const resp = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({admin_login: adminLogin, admin_password: adminPass, action: 'revoke', login: login})
                });
                const data = await resp.json();
                if (data.ok) { showToast('Revoked: ' + login, 'success'); refreshUsers(); }
                else { showToast(data.error, 'error'); }
            } catch (e) { showToast('Error', 'error'); }
        }
    </script>
</body>
</html>
